models:
  # Main LLM generation model (via LiteLLM Proxy)
  - type: main
    engine: openai
    model: gemini-flash
    parameters:
      base_url: "http://localhost:4000/v1"

  # Local embeddings for Colang intent matching
  - type: embeddings
    engine: openai
    model: text-embedding-3-small # <--- Matches "id": "text-embedding-3-small" from /v1/models
    parameters:
      base_url: "http://localhost:4000/v1"

rails:
  input:
    flows: []
  output:
    flows: []

  dialog:
    user_intent: true
    llm_intent_generation: false # Stops fallback LLM calls to gemini-flash
    single_call:
      enabled: true

sample_conversation: ""




