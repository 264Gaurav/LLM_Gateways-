model_list:
  # ==========================================
  # ROUTER ENTRYPOINT
  # ==========================================
  - model_name: gateway-model
    litellm_params:
      model: auto_router/complexity_router
      drop_params: true

      complexity_router_config:
        session_affinity: false  # Re-evaluate every single incoming message
        tiers:
          SIMPLE: budget
          MEDIUM: smart-fast
          COMPLEX: smart-best
          REASONING: smart-reasoning
        tier_boundaries:
          simple_medium: 0.05
          medium_complex: 0.35
          complex_reasoning: 0.55
      complexity_router_default_model: smart-fast

  # ==========================================
  # TIERED ROUTING GROUPS
  # ==========================================

  # Tier: COMPLEX / High Quality
  - model_name: smart-best
    litellm_params:
      model: openrouter/openai/gpt-5.4-mini
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      num_retries: 2

  # Tier: MEDIUM / Ultra-Fast Everyday Chat
  - model_name: smart-fast
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      num_retries: 2

  # Tier: REASONING / Analytical & Deep Thinking
  - model_name: smart-reasoning
    litellm_params:
      model: openai/big-pickle
      api_key: os.environ/ZEN_API_KEY
      api_base: https://opencode.ai/zen/v1
      num_retries: 2

  # Tier: SIMPLE / Free & Low-Cost
  - model_name: budget
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY
      num_retries: 1

  # ==========================================
  # DIRECT PROVIDER ENDPOINTS
  # ==========================================

  # Groq (Ultra-low latency inference)
  - model_name: groq-fast
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  - model_name: groq-instant
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY

  # Nvidia NIM Cloud Endpoint
  - model_name: nvidia-llama-70b
    litellm_params:
      model: nvidia_nim/meta/llama-3.3-70b-instruct
      api_key: os.environ/NVIDIA_API_KEY

  # Google Gemini Direct
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # OpenRouter Direct
  - model_name: openrouter-fast
    litellm_params:
      model: openrouter/openai/gpt-5.4-mini
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

  # Zen Stealth Free Endpoints
  - model_name: zen-big-pickle
    litellm_params:
      model: openai/big-pickle
      api_key: os.environ/ZEN_API_KEY
      api_base: https://opencode.ai/zen/v1

  - model_name: zen-minimax-free
    litellm_params:
      model: openai/minimax-m2.5-free
      api_key: os.environ/ZEN_API_KEY
      api_base: https://opencode.ai/zen/v1

  # Local Ollama Endpoints
  - model_name: llama3
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: os.environ/OLLAMA_BASE_URL

  - model_name: gemma
    litellm_params:
      model: ollama/gemma2:2b
      api_base: os.environ/OLLAMA_BASE_URL

  # ==========================================
  # EMBEDDING MODELS (Primary + Cloud Fallbacks)
  # ==========================================
  
  # Primary Embedding: Local Ollama Nomic
  - model_name: local-embedding
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_BASE_URL

  # Fallback Embedding 1: Google Gemini
  - model_name: gemini-embedding
    litellm_params:
      model: gemini/text-embedding-004
      api_key: os.environ/GEMINI_API_KEY

  # Fallback Embedding 2: OpenRouter / OpenAI
  - model_name: openrouter-embedding
    litellm_params:
      model: openrouter/openai/text-embedding-3-small
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

# ==========================================
# GLOBAL ROUTER & FALLBACK SETTINGS
# ==========================================
router_settings:
  num_retries: 2
  timeout: 60
  allowed_fails: 1        # Cool down model after 1 failure (e.g. rate limit 429)
  cooldown_time: 60        # Put rate-limited models on 60-second cooldown

  # Clean, explicit tier-to-tier fallback chain
  fallbacks:
    - gateway-model: ["smart-fast", "budget", "openrouter-fast"]
    - smart-best: ["nvidia-llama-70b", "zen-big-pickle", "openrouter-fast", "gemma"]
    - smart-fast: ["groq-fast", "openrouter-fast", "llama3"]
    - smart-reasoning: ["zen-big-pickle", "openrouter-fast", "groq-fast"]
    - budget: ["groq-instant", "zen-minimax-free", "llama3"]
    - gemini-flash: ["openrouter-fast", "zen-minimax-free", "llama3"]
    
    # Embedding Fallback Chain for Semantic Cache
    - local-embedding: ["gemini-embedding", "openrouter-embedding"]


# ==========================================
# REDIS CACHE CONFIGURATION
# ==========================================
litellm_settings:
  cache: true
  enable_redis_auth_cache: os.environ/REDIS_AUTH_CACHE

  cache_params:
    type: os.environ/CACHE_TYPE
    
    # Connection Parameters
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
    ttl: os.environ/REDIS_TTL
    
    # Semantic Caching Parameters
    redis_semantic_cache_embedding_model: local-embedding
    similarity_threshold: 0.97  # <--- MUST be an unquoted float here
    namespace: "litellm.cache"


    # Ensure prompt/response details are NOT turned off globally
    turn_off_message_logging: false
  
    # Set detailed logging levels for proxy traces
    set_verbose: true  # Set to true temporarily if debugging UI logs



# ==========================================
# GENERAL & SECURITY SETTINGS
# ==========================================
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_responses_id_security: true

# Enable UI database logging for prompts, responses, & fallback routing
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  
  # Database connection for logs
  database_url: os.environ/DATABASE_URL
  
  # Ensure callbacks write request/response payloads to DB
  success_callback: ["db"]
  failure_callback: ["db"]






