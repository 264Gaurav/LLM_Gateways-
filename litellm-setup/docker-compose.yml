version: "3.8"

services:
  # -------------------------------------------------------------
  # REDIS STACK (Exact & Semantic Caching)
  # -------------------------------------------------------------
  redis:
    image: redis/redis-stack:latest
    container_name: litellm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001" # Optional: Redis Insight GUI
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # POSTGRES DATABASE (Spend & Audit Logging)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # -------------------------------------------------------------
  # LITELLM GATEWAY PROXY
  # -------------------------------------------------------------
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    container_name: litellm-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./copilot_tokens:/root/.config/litellm/github_copilot
    env_file:
      - .env
    environment:
      # Database & Logging Controls (Fixes missing UI Request/Response logs)
      DATABASE_URL: ${DATABASE_URL}
      # UI Request & Response Audit Controls
      STORE_MODEL_IN_DB: "True"
      STORE_PROMPTS_IN_SPEND_LOGS: "True"
      
      # Observability (Logfire / OTEL)
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ZEN_API_KEY: ${ZEN_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-${NVIDIA_NIM_API_KEY:-}}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-${NVIDIA_API_KEY:-}}
      GITHUB_COPILOT_TOKEN_DIR: /root/.config/litellm/github_copilot
    command: ["--config", "/app/config.yaml", "--detailed_debug"]
    extra_hosts:
      - "host.docker.internal:host-gateway" # Connects to host Ollama instance

# -------------------------------------------------------------
# PERSISTENT VOLUMES
# -------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:







